<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pickle Animations – Drawings</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="parallax-bg">
      <div class="parallax-radial"></div>
      <div id="parallax-glow-1" class="parallax-glow"></div>
      <div id="parallax-glow-2" class="parallax-glow"></div>
      <div id="parallax-glow-3" class="parallax-glow"></div>
      <div id="parallax-glow-4" class="parallax-glow"></div>
    </div>

    <div id="cursor-dot"></div>
    <div id="cursor-ring"></div>

    <nav id="navbar">
      <div class="page-container navbar-inner">
        <a href="/" class="navbar-logo">
          <div class="navbar-logo-avatar">
            <img
              src="https://yt3.ggpht.com/ZBG6HnvtFbj5cXTGZIOj0Y3KPi8911pTlIwQFhrLoNZEDa7sT7aPDVIIouVNYKE-e6a60Nyu_ZY=s512-c-k-c0x00ffffff-no-rj-mo"
              alt="Logo"
            />
          </div>
          <span class="navbar-logo-text">Pickle Animations</span>
        </a>
        <div class="navbar-links">
          <a href="/" id="nav-home" class="nav-item">Home</a>
          <a href="/drawings.html" id="nav-drawings" class="nav-item">Drawings</a>
        </div>
      </div>
    </nav>

    <section id="drawings">
      <div class="page-container">
        <div id="drawings-header">
          <div>
            <h2 class="section-title"><span>Drawings</span></h2>
            <p class="section-subtitle">Pickle's drawings</p>
          </div>
        </div>
        <div id="drawings-grid"></div>
      </div>
    </section>

    <section id="socials">
      <div class="page-container--mid socials-inner">
        <div id="socials-header">
          <h2 class="socials-title">Reach out</h2>
          <p class="socials-subtitle">Find Pickle on:</p>
        </div>
        <div id="socials-grid"></div>
      </div>
    </section>

    <button id="back-to-top" aria-label="Back to top">
      <img src="/icons/arrow-up.svg" alt="" aria-hidden="true" class="icon" />
    </button>

    <script src="main.js" defer></script>
  </body>
</html>
